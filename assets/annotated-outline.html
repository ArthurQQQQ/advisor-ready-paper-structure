<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper structure review</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172b40;
      --blue: #355a85;
      --keyline: #9daebc;
      --sky: #e6effa;
      --mint: #e5f3ec;
      --teal: #147766;
      --serif: "STIX Two Text", "Iowan Old Style", Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      --body: "Source Sans 3", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font: 1.0625rem/1.55 var(--body); }
    main { width: min(65rem, 100% - 2.5rem); margin: clamp(1.75rem, 5vw, 4.25rem) auto; }
    h1, h2, p, ol, ul, figure { margin: 0; }
    h1, h2, .node { font-family: var(--serif); }
    h1 { font-size: clamp(2.3rem, 6vw, 4rem); font-weight: 700; line-height: 1.08; letter-spacing: -.025em; }
    .verdict { max-width: 64ch; margin: .8rem 0 1.6rem; font-size: clamp(1.0625rem, 2.2vw, 1.25rem); }
    .map { --gap: clamp(1rem, 2.8vw, 2.35rem); }
    .flow {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: var(--gap);
      padding: 0;
      list-style: none;
    }
    .flow > li { position: relative; min-width: 0; }
    .flow > li:not(:last-child)::after {
      position: absolute;
      content: "";
      inset-block-start: 50%;
      inset-inline-end: calc(-1 * var(--gap) + .16rem);
      width: calc(var(--gap) - .32rem);
      height: .65rem;
      background: var(--blue);
      clip-path: polygon(0 40%, 72% 40%, 72% 0, 100% 50%, 72% 100%, 72% 60%, 0 60%);
      transform: translateY(-50%);
      pointer-events: none;
    }
    .node {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 3.15rem;
      padding: .5rem .55rem;
      border: 1px solid var(--blue);
      border-radius: .3rem;
      background: #fff;
      color: var(--ink);
      font-size: 1.0625rem;
      font-weight: 680;
      line-height: 1.25;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    .node:hover { background: var(--sky); }
    .node:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .node[aria-expanded="true"] { border-color: var(--teal); background: var(--mint); box-shadow: inset 0 0 0 1px var(--teal); }
    .between {
      width: .56rem;
      height: 1.45rem;
      margin: .18rem auto;
      background: var(--blue);
      clip-path: polygon(42% 0, 58% 0, 58% 68%, 100% 68%, 50% 100%, 0 68%, 42% 68%);
    }
    .results { padding: .78rem .88rem .88rem; background: var(--sky); border: 1px solid var(--blue); border-radius: .32rem; }
    .results h2 { margin-block-end: .65rem; font-size: 1.35rem; line-height: 1.2; }
    .actions[hidden] { display: none; }
    .actions {
      margin-block-start: 1.05rem;
      padding: .65rem 1rem .7rem;
      border: 1px solid var(--teal);
      border-radius: .3rem;
      background: var(--mint);
    }
    .actions ul { padding-inline-start: 1.35rem; }
    .actions li + li { margin-block-start: .3rem; }

    @media (max-width: 38rem) {
      main { width: calc(100% - 1.35rem); margin-block-start: 1.65rem; }
      .map { --gap: .82rem; }
      .node { padding: .45rem .18rem; }
      .results { padding-inline: .45rem; }
      .results h2 { margin-inline-start: .25rem; }
    }
    @media (max-width: 27rem) {
      .results .flow { grid-auto-flow: row; grid-template-columns: 1fr; gap: .95rem; }
      .results .flow > li:not(:last-child)::after {
        inset-block-start: auto;
        inset-block-end: -.78rem;
        inset-inline: 50% auto;
        width: .56rem;
        height: .62rem;
        clip-path: polygon(42% 0, 58% 0, 58% 60%, 100% 60%, 50% 100%, 0 60%, 42% 60%);
        transform: translateX(-50%);
      }
    }
    @media print {
      @page { size: landscape; margin: 12mm; }
      main { width: 100%; margin: 0; }
      .map { break-inside: avoid; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Paper title</h1>
      <p class="verdict">Identify the change that will make the paper’s central argument easier to follow.</p>
    </header>
    <figure class="map" aria-label="Paper structure">
      <ol class="flow">
          <li><button class="node" type="button" data-actions="abstract-edits" aria-controls="section-edits" aria-expanded="false">Abstract</button></li>
          <li><button class="node" type="button" data-actions="introduction-edits" aria-controls="section-edits" aria-expanded="false">Introduction</button></li>
          <li><button class="node" type="button" data-actions="method-edits" aria-controls="section-edits" aria-expanded="false">Method</button></li>
          <li><button class="node" type="button" data-actions="setup-edits" aria-controls="section-edits" aria-expanded="false">Setup</button></li>
        </ol>
      <div class="between" aria-hidden="true"></div>
      <section class="results" aria-labelledby="results-heading">
        <h2 id="results-heading">Results</h2>
        <ol class="flow">
          <li><button class="node" type="button" data-actions="primary-edits" aria-controls="section-edits" aria-expanded="false">Main result</button></li>
          <li><button class="node" type="button" data-actions="controls-edits" aria-controls="section-edits" aria-expanded="false">Controls</button></li>
          <li><button class="node" type="button" data-actions="limits-edits" aria-controls="section-edits" aria-expanded="false">Secondary analysis</button></li>
        </ol>
      </section>
      <div class="between" aria-hidden="true"></div>
      <ol class="flow">
          <li><button class="node" type="button" data-actions="discussion-edits" aria-controls="section-edits" aria-expanded="false">Discussion</button></li>
          <li><button class="node" type="button" data-actions="conclusion-edits" aria-controls="section-edits" aria-expanded="false">Conclusion</button></li>
          <li><button class="node" type="button" data-actions="appendix-edits" aria-controls="section-edits" aria-expanded="false">Appendix</button></li>
        </ol>
    </figure>
    <section class="actions" id="section-edits" aria-label="Suggested edits" aria-live="polite" hidden></section>
  </main>
  <template id="abstract-edits">
    <ul>
      <li>State the research question, approach, and strongest supported result.</li>
    </ul>
  </template>
  <template id="introduction-edits">
    <ul>
      <li>Name the unresolved problem and the contribution the paper will establish.</li>
    </ul>
  </template>
  <template id="method-edits">
    <ul>
      <li>Connect the key design choice to the research question.</li>
    </ul>
  </template>
  <template id="setup-edits">
    <ul>
      <li>Briefly state each comparison’s cohort, metric, and relevant constraints.</li>
    </ul>
  </template>
  <template id="primary-edits">
    <ul>
      <li>Put the primary comparison beside the claim it tests.</li>
    </ul>
  </template>
  <template id="controls-edits">
    <ul>
      <li>Show which design choice each baseline or ablation isolates.</li>
    </ul>
  </template>
  <template id="limits-edits">
    <ul>
      <li>Place follow-up evidence after the main comparison it qualifies.</li>
    </ul>
  </template>
  <template id="discussion-edits">
    <ul>
      <li>Tie the most important limitation to the result it qualifies.</li>
    </ul>
  </template>
  <template id="conclusion-edits">
    <ul>
      <li>Answer the opening question within the scope of the evidence.</li>
    </ul>
  </template>
  <template id="appendix-edits">
    <ul>
      <li>Link each protocol or extended result to its first use in the paper.</li>
    </ul>
  </template>
  <script>
    const map = document.querySelector(".map");
    const actions = document.querySelector(".actions");
    let selectedNode;

    map.addEventListener("click", (event) => {
      const node = event.target.closest("[data-actions]");
      if (!node) return;
      const wasSelected = node === selectedNode;
      if (selectedNode) selectedNode.setAttribute("aria-expanded", "false");
      selectedNode = wasSelected ? undefined : node;

      actions.replaceChildren();
      actions.hidden = !selectedNode;
      if (!selectedNode) return;

      selectedNode.setAttribute("aria-expanded", "true");
      const edits = document.getElementById(selectedNode.dataset.actions);
      actions.append(edits.content.cloneNode(true));
      if (actions.getBoundingClientRect().bottom > window.innerHeight) {
        actions.scrollIntoView({ block: "nearest" });
      }
    });
  </script>
</body>
</html>
