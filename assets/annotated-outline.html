<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper structure review</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #111115;
      --side: #0c0d11;
      --panel: #191a20;
      --rule: #2e3039;
      --wire: #414452;
      --ink: #edeef4;
      --muted: #aeb1c1;
      --accent: #b7baff;
      --accent-bg: #232540;
      --gap: #ebc890;
      --gap-bg: #241f1a;
      --red: #f79598;
      --yellow: #ebc890;
      --green: #84d6a7;
      --sans: "Geist", "Inter", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: "STIX Two Text", "Iowan Old Style", Georgia, "Songti SC", serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 18rem;
      min-height: 100dvh;
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 1rem/1.5 var(--sans);
    }
    [hidden] { display: none !important; }
    h1, h2, h3, p, ol, ul, blockquote { margin: 0; }
    a { color: var(--accent); text-underline-offset: .22em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    ::selection { background: #41477e; color: white; }
    .intro {
      padding: 1.2rem clamp(1.2rem, 3vw, 2.75rem) 1.25rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: .9rem 1.25rem;
    }
    .intro-copy { flex: 1 1 34rem; }
    .intro h1 {
      max-width: 48ch;
      font-size: clamp(1.55rem, 2.45vw, 2.35rem);
      font-weight: 660;
      line-height: 1.12;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    .verdict { max-width: 86ch; margin-top: .6rem; color: var(--muted); text-wrap: pretty; }
    .approval-tools { display: flex; flex-direction: column; gap: .44rem; align-items: flex-start; }
    .approval-buttons, .action-controls { display: flex; gap: .42rem; flex-wrap: wrap; align-items: baseline; }
    .control {
      border: 1px solid var(--rule);
      border-radius: .35rem;
      padding: .36rem .62rem;
      background: var(--panel);
      color: var(--ink);
      font: 550 .86rem/1.3 var(--sans);
      cursor: pointer;
    }
    .control:hover:not(:disabled) { border-color: var(--accent); }
    .control.primary { border-color: #6166af; background: var(--accent-bg); }
    .control:disabled { opacity: .48; cursor: default; }
    .approval-status, .action-state { color: var(--muted); font-size: .82rem; }
    .adopted { color: var(--green); }
    .attention { color: var(--yellow); }
    .action-item { list-style: none; padding-block: .48rem .65rem; }
    .fact .action-list { padding-inline-start: 0; }
    .action-item + .action-item { border-top: 1px solid var(--rule); }
    .action-controls { margin-block-start: .45rem; }
    .action-preview { margin-block-start: .42rem; }
    .action-preview summary { color: var(--accent); font-size: .85rem; cursor: pointer; }
    .action-preview pre {
      margin: .26rem 0 .45rem;
      padding: .46rem .55rem;
      border: 1px solid var(--rule);
      border-radius: .26rem;
      background: var(--panel);
      color: var(--ink);
      font: .82rem/1.5 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(15rem, .87fr) minmax(23rem, 1.25fr) minmax(17rem, 1.13fr);
      grid-template-areas: "review map source";
      min-height: 0;
    }
    .pane { min-width: 0; display: flex; flex-direction: column; }
    .map-pane { grid-area: map; }
    .source-pane { grid-area: source; border-inline-start: 1px solid var(--rule); }
    .review-pane { grid-area: review; border-inline-end: 1px solid var(--rule); }
    .side { background: var(--side); }
    .pane-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: .6rem;
      padding: .83rem 1.12rem;
      border-bottom: 1px solid var(--rule);
    }
    .pane-head h2 { font-size: .98rem; font-weight: 625; }
    .pane-head a { font-size: .87rem; }
    .pane-body { padding: clamp(1rem, 1.65vw, 1.55rem); min-width: 0; }
    .map-body { padding: 1.15rem clamp(.8rem, 1.8vw, 1.6rem) 1.4rem; }
    .argument-map, .branches { list-style: none; padding: 0; }

    .stage-row {
      --rail: 1.68rem;
      position: relative;
      display: grid;
      grid-template-columns: var(--rail) minmax(5.5rem, .5fr) minmax(0, 1.7fr);
      align-items: stretch;
      column-gap: .73rem;
      min-width: 0;
      padding-block: .5rem;
    }
    .stage-row:not(:last-child)::before {
      position: absolute;
      z-index: 0;
      inset: 1.34rem auto -1.44rem calc(var(--rail) / 2);
      width: 1px;
      background: var(--wire);
      content: "";
    }
    .stage-number {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: var(--rail);
      height: var(--rail);
      margin-block-start: .13rem;
      background: var(--panel);
      border: 1px solid var(--wire);
      border-radius: 50%;
      color: var(--muted);
      font: 600 .86rem/1 var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .stage-title {
      align-self: start;
      padding-block-start: .3rem;
      font-size: .96rem;
      font-weight: 620;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .branches {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .38rem;
    }
    .branches::before {
      position: absolute;
      z-index: 0;
      inset: .96rem auto auto -.69rem;
      width: .69rem;
      height: 1px;
      background: var(--wire);
      content: "";
    }
    .branches > li:only-child { grid-column: 1 / -1; }
    .branches > li { min-width: 0; }
    .node {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      width: 100%;
      height: 100%;
      min-height: 2.68rem;
      padding: .51rem .55rem;
      border: 1px solid var(--rule);
      border-radius: .42rem;
      background: var(--panel);
      color: var(--ink);
      text-align: start;
      font: 550 .87rem/1.3 var(--sans);
      cursor: pointer;
      transition: background-color 140ms, border-color 140ms;
    }
    .node:hover { border-color: #777b95; background: #22232d; }
    .node[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); }
    .node [data-number], .review-number { color: var(--accent); font: 600 .85rem/1.2 var(--mono); }
    .node-label { min-width: 0; overflow-wrap: anywhere; }
    .severity-legend {
      display: flex;
      flex-wrap: wrap;
      gap: .28rem .85rem;
      margin-block-end: .58rem;
      color: var(--muted);
      font-size: .78rem;
    }
    .severity-key { display: inline-flex; align-items: center; gap: .3rem; }
    [data-severity="red"] { --severity: var(--red); }
    [data-severity="yellow"] { --severity: var(--yellow); }
    [data-severity="green"] { --severity: var(--green); }
    .severity-dot {
      flex: none;
      align-self: center;
      width: .48rem;
      height: .48rem;
      border-radius: 50%;
      background: var(--severity);
    }
    .node .severity-dot { margin-inline-start: auto; }
    .severity-label { color: var(--severity, var(--muted)); font-size: .82rem; }
    .locator {
      margin-block-end: .85rem;
      color: var(--muted);
      font-size: .9rem;
      overflow-wrap: anywhere;
    }
    .manuscript {
      padding: .9rem 1rem;
      border: 1px solid var(--rule);
      border-radius: .42rem;
      background: #16171c;
      color: #d6d7e1;
      font: 1.032rem/1.72 var(--serif);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    mark {
      padding-block: .13em;
      background: #3a3f70;
      color: #fff;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .review-title {
      margin-block: .4rem .6rem;
      font-size: clamp(1.2rem, 1.7vw, 1.62rem);
      letter-spacing: -.025em;
      line-height: 1.15;
      text-wrap: balance;
    }
    .summary { color: var(--muted); }
    .fact { margin-block-start: 1.04rem; padding-block-start: .85rem; border-top: 1px solid var(--rule); }
    .fact h3, .fact h4 { margin: 0 0 .28rem; font-size: .93rem; font-weight: 680; }
    .fact p, .fact li, .summary { font-size: .95rem; overflow-wrap: anywhere; }
    .fact ul { padding-inline-start: 1.18rem; }
    .fact li + li { margin-block-start: .4rem; }
    .fact-gap {
      padding: .76rem .85rem;
      border: 1px solid #59472f;
      border-radius: .42rem;
      background: var(--gap-bg);
    }
    .fact-gap h4 { color: var(--severity, var(--gap)); }
    .jump-source { display: none; }
    .empty { max-width: 55ch; color: var(--muted); }
    .pdf-status {
      padding: .62rem 1.12rem;
      border-bottom: 1px solid var(--rule);
      color: var(--muted);
      font-size: .9rem;
    }
    .pdf-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .65rem;
      padding: .48rem .8rem;
      border-bottom: 1px solid var(--rule);
      color: var(--muted);
      font-size: .86rem;
      font-variant-numeric: tabular-nums;
    }
    .pdf-pages { display: flex; align-items: center; gap: .44rem; }
    .pdf-tools button {
      padding: .24em .5em;
      border: 1px solid var(--rule);
      border-radius: .28rem;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .pdf-tools button:disabled { opacity: .5; cursor: default; }
    .pdf-tools button[aria-pressed="true"] { border-color: var(--accent); }
    .pdf-sheet {
      position: relative;
      margin-inline: auto;
      background: #fff;
      color-scheme: light;
    }
    .pdf-sheet canvas { display: block; width: 100%; height: 100%; }
    .pdf-highlight-layer, .textLayer { position: absolute; inset: 0; }
    .pdf-highlight-layer { z-index: 1; pointer-events: none; }
    .pdf-highlight {
      position: absolute;
      background: rgb(255 205 48 / 48%);
      mix-blend-mode: multiply;
      box-shadow: inset 0 -1px #ad7900;
    }
    .textLayer {
      z-index: 2;
      overflow: clip;
      line-height: 1;
      text-size-adjust: none;
      --min-font-size: 1;
      --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
      --min-font-size-inv: calc(1 / var(--min-font-size));
    }
    .textLayer span, .textLayer br {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      transform-origin: 0 0;
    }
    .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) {
      --font-height: 0;
      --scale-x: 1;
      --rotate: 0deg;
      font-size: calc(var(--text-scale-factor) * var(--font-height));
      transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
    }
    .textLayer .markedContent { display: contents; }
    .textLayer ::selection { color: transparent; background: #a6c5f5a0; }
    .hiddenCanvasElement { position: absolute; top: 0; left: 0; display: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (min-width: 65em) {
      body { display: flex; flex-direction: column; height: 100dvh; }
      .workspace { flex: 1; grid-template-rows: minmax(0, 1fr); }
      .pane { min-height: 0; }
      .pane-body { min-height: 0; flex: 1; overflow: auto; scrollbar-color: #424550 transparent; }
    }
    @media (max-width: 64.99em) {
      .workspace {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-areas: "map map" "review source";
      }
      .side { border-block-start: 1px solid var(--rule); }
      .review-pane { border-inline-end: 0; }
      .source-pane { border-inline-start: 1px solid var(--rule); }
      .map-body { width: min(100%, 47rem); margin-inline: auto; }
      .jump-source { display: inline; font-size: .9rem; }
    }
    @media (max-width: 39em) {
      .workspace { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "review" "source"; }
      .source-pane { border-inline-start: 0; }
      .stage-row {
        grid-template-columns: var(--rail) minmax(0, 1fr);
        grid-template-areas: "number stage" ". branches";
        row-gap: .4rem;
      }
      .stage-number { grid-area: number; }
      .stage-title { grid-area: stage; }
      .branches { grid-area: branches; }
      .branches::before { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node { transition: none; }
    }
    @media print {
      :root { color-scheme: light; --canvas: white; --side: white; --panel: white; --ink: #111; --muted: #333; --rule: #aaa; --wire: #666; --accent: #272952; --accent-bg: #e8e9f5; }
      body { display: block; height: auto; }
      .workspace { display: block; }
      .pane { border: 0; break-inside: avoid; }
      .pane-body { overflow: visible; }
      .manuscript { background: white; color: #111; }
      mark { background: #e3e4f6; color: #111; }
      .fact-gap { background: white; }
      .fact-gap h4 { color: #5c3f19; }
      .jump-source { display: none; }
      .approval-buttons, .action-controls button { display: none; }
    }
  </style>
</head>
<body>
  <header class="intro">
    <div class="intro-copy">
      <h1 id="paper-title">Paper structure review</h1>
      <p class="verdict" id="verdict"></p>
    </div>
    <div class="approval-tools" id="approval-tools" hidden>
      <div class="approval-buttons">
        <button class="control primary" id="approve-all" type="button"></button>
        <button class="control" id="download-revisions" type="button" disabled></button>
      </div>
      <output class="approval-status" id="approval-status" role="status"></output>
    </div>
  </header>
  <main class="workspace" id="workspace" hidden>
    <section class="pane map-pane" aria-labelledby="map-heading">
      <header class="pane-head"><h2 id="map-heading">Argument map</h2></header>
      <div class="pane-body map-body">
        <div class="severity-legend" id="severity-legend"></div>
        <ol class="argument-map" id="argument-map"></ol>
      </div>
    </section>
    <section class="pane side review-pane" id="review" aria-labelledby="review-heading" tabindex="-1">
      <header class="pane-head">
        <h2 id="review-heading">Section review</h2>
        <a class="jump-source" id="jump-source" href="#source">View source</a>
      </header>
      <div class="pane-body" id="review-body">
        <article id="section-review">
          <div class="review-number" id="review-number"></div>
          <h3 class="review-title" id="review-title"></h3>
          <p class="severity-label" id="review-severity"></p>
          <p class="summary" id="review-summary"></p>
          <div class="fact" id="action-block">
            <h4 id="action-heading">Revision</h4>
            <ul class="action-list" id="actions"></ul>
          </div>
          <div class="fact" id="support-block">
            <h4 id="support-heading">What the draft supports</h4>
            <p id="support"></p>
          </div>
          <div class="fact fact-gap" id="gap-block">
            <h4 id="gap-heading">Gap</h4>
            <p id="gap"></p>
          </div>
        </article>
      </div>
    </section>
    <section class="pane side source-pane" id="source" aria-labelledby="source-heading" tabindex="-1">
      <header class="pane-head">
        <h2 id="source-heading">Manuscript</h2>
        <a id="original" hidden target="_blank" rel="noopener">Open PDF</a>
      </header>
      <div class="pdf-tools" id="pdf-tools" hidden>
        <div class="pdf-pages">
          <button type="button" id="pdf-previous"></button>
          <output id="pdf-page"></output>
          <button type="button" id="pdf-next"></button>
        </div>
        <button type="button" id="pdf-zoom" aria-pressed="false"></button>
      </div>
      <p class="pdf-status" id="pdf-status" role="status" hidden></p>
      <div class="pane-body" id="source-body">
        <div id="pdf-view" hidden></div>
        <p class="locator" id="locator"></p>
        <blockquote class="manuscript" id="excerpt"><span id="source-before"></span><mark id="highlight"></mark><span id="source-after"></span></blockquote>
        <p class="empty" id="no-source" hidden></p>
      </div>
    </section>
  </main>
  <p class="sr-only" id="selection" role="status"></p>
  <noscript><p class="intro">Enable JavaScript to open the interactive review.</p></noscript>

  <!--
    Replace report-data with one JSON object. Escape "<" in the serialized JSON as "\u003c".
    Optional: lang ("en" or "zh-CN"), sourceLang, initialNode, manuscriptHref (local PDF),
    sourceLabel (for example, "Source packet"). Set lang on html to the UI language.
    sections is an ordered list of {id, title, nodes}. Each node has a unique subsection id
    (e.g. "1.2"), title, optional summary, support, gap (string or null), severity
    ("red", "yellow", "green", or null), and actions.
    Each action is a label string or {label, edits:[{file,before,after}], reason?}. To queue a
    proposal that needs more evidence, omit edits and explain why in reason. An action with
    multiple edits applies only if every exact, unique source match succeeds.
    Set report.adoption to {id, files:{"relative/draft.tex":"original text"}} for an editable
    snapshot. Use a stable version-specific ID. Embed only reviewed text files, never credentials.
    source is null if unavailable, or {locator, pre, highlight, post, page?}. Use contiguous
    verbatim source passages. Include spaces and paragraph breaks in pre/post where applicable.
    page is the verified PDF file page index, starting at 1. The array order is the proposed
    argument order. Derive numbering and stage boundaries from the structure you recommend.
  -->
  <script type="application/json" id="report-data">
  {
    "title": "Paper title",
    "verdict": "State the most consequential change to the argument.",
    "sections": [
      {
        "id": "1",
        "title": "Introduction",
        "nodes": [
          {
            "id": "1.1",
            "title": "Research question",
            "summary": "Establish the question the paper will answer.",
            "support": "Record the strongest claim supported by the supplied draft.",
            "gap": null,
            "actions": ["State the research question in the opening. Name the comparison that will answer it."],
            "source": null
          }
        ]
      }
    ]
  }
  </script>
  <!-- EMBEDDED_PDF -->
  <script>
    const el = id => document.getElementById(id);
    const report = JSON.parse(el("report-data").textContent);
    const labels = report.lang?.startsWith("zh")
      ? {
          map: "论证结构", review: "小节审阅", source: "原文", pdf: "打开 PDF",
          jump: "查看原文", support: "已有证据", gap: "缺口", action: "修改建议",
          noSource: "这一步缺少可以定位的原文。",
          severity: {red: "优先补关键证据", yellow: "需修改或核对", green: "小改动", none: "无需修改"},
          approve: "批准", undo: "撤销批准", all: "一键批准",
          download: "下载修订包", preview: "查看拟议改动", before: "原文", after: "改为",
          applied: "已写入修订稿", pending: "已批准 · 待人工补充", unmatched: "已批准 · 需核对原文",
          noEdits: "需要可编辑原稿或进一步核查。",
          receipt: "修订记录", files: "已修改的文件", emptyFiles: "本次没有写入源文件。",
          progress: (accepted, total, applied, pending) =>
            "已批准 " + accepted + " / " + total + " · 已写入 " + applied + " · 待处理 " + pending
        }
      : {
          map: "Argument map", review: "Section review", source: "Manuscript", pdf: "Open PDF",
          jump: "View source", support: "What the draft supports", gap: "Gap", action: "Revision",
          noSource: "No source passage was available for this part of the argument.",
          severity: {red: "Key evidence missing", yellow: "Revise or verify", green: "Small edit", none: "No change needed"},
          approve: "Approve", undo: "Undo approval", all: "Approve all",
          download: "Download revisions", preview: "Preview change", before: "Before", after: "After",
          applied: "Written to draft", pending: "Approved · needs follow-up", unmatched: "Approved · check source match",
          noEdits: "Requires editable source or further verification.",
          receipt: "Revision record", files: "Changed files", emptyFiles: "No source files were changed.",
          progress: (accepted, total, applied, pending) =>
            accepted + " / " + total + " approved · " + applied + " written · " + pending + " pending"
        };

    document.documentElement.lang = report.lang || "en";
    document.title = report.title;
    el("paper-title").textContent = report.title;
    el("verdict").textContent = report.verdict;
    el("map-heading").textContent = labels.map;
    el("review-heading").textContent = labels.review;
    el("source-heading").textContent = report.sourceLabel || labels.source;
    el("original").textContent = labels.pdf;
    el("jump-source").textContent = labels.jump;
    el("support-heading").textContent = labels.support;
    el("gap-heading").textContent = labels.gap;
    el("action-heading").textContent = labels.action;
    el("no-source").textContent = labels.noSource;
    el("excerpt").lang = report.sourceLang || report.lang || "en";

    const manuscript = report.manuscriptHref
      ? new URL(report.manuscriptHref, location.href)
      : null;
    const pdf = manuscript && ["file:", "https:", "http:"].includes(manuscript.protocol)
      ? manuscript : null;
    const items = new Map();
    let selected = null;
    const pdfPanel = typeof createPdfPanel === "function" ? createPdfPanel(report.lang || "en") : null;

    function make(tag, className, content) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (content != null) element.textContent = content;
      return element;
    }

    function severity(node) {
      if (node.severity === null) return "none";
      if (["red", "yellow", "green"].includes(node.severity)) return node.severity;
      return node.gap ? "yellow" : node.actions?.length ? "green" : "none";
    }

    for (const [level, label] of Object.entries(labels.severity)) {
      const key = make("span", "severity-key");
      key.dataset.severity = level;
      if (level !== "none") key.append(make("span", "severity-dot"));
      key.append(document.createTextNode(level === "none" ? "— " + label : label));
      el("severity-legend").append(key);
    }

    const proposals = new Map();
    const proposalsByNode = new Map();
    for (const section of report.sections) {
      const row = make("li", "stage-row");
      const number = make("span", "stage-number", section.nodes[0]?.id.split(".")[0] || section.id);
      number.setAttribute("aria-hidden", "true");
      const heading = make("h3", "stage-title", section.title);
      const branches = make("ol", "branches");
      for (const node of section.nodes) {
        const item = make("li");
        const button = make("button", "node");
        const badge = make("span", "", node.id);
        badge.dataset.number = "";
        button.type = "button";
        button.setAttribute("aria-controls", "section-review source-body");
        button.setAttribute("aria-pressed", "false");
        button.append(badge, make("span", "node-label", node.title));
        const level = severity(node);
        button.dataset.severity = level;
        if (level !== "none") {
          const dot = make("span", "severity-dot");
          dot.setAttribute("aria-hidden", "true");
          button.append(dot);
        }
        button.append(make("span", "sr-only", labels.severity[level]));
        button.title = labels.severity[level];
        const actions = level === "none" ? [] : (node.actions || []).map((action, index) => {
          const proposal = typeof action === "string" ? {label: action} : action;
          const key = node.id + ":" + (index + 1);
          const entry = {...proposal, key, nodeId: node.id, nodeTitle: node.title};
          proposals.set(key, entry);
          return entry;
        });
        proposalsByNode.set(node.id, actions);
        button.addEventListener("click", () => select(node.id, {navigate: true, reveal: true}));
        item.append(button);
        branches.append(item);
        items.set(node.id, {node, button});
      }
      row.append(number, heading, branches);
      el("argument-map").append(row);
    }

    const validFile = name => typeof name === "string" && name !== "" &&
      !/[:\\\u0000]/.test(name) && name.split("/").every(part => part && part !== "." && part !== "..");
    const originalFiles = new Map(Object.entries(report.adoption?.files || {}).filter(
      ([name, text]) => validFile(name) && typeof text === "string"
    ));
    const storageKey = report.adoption?.id ? "paper-review-approved:" + report.adoption.id : null;
    let approvals = [];
    try {
      const saved = storageKey && JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved)) approvals = [...new Set(saved.filter(key => proposals.has(key)))];
    } catch (error) {
      // File previews can disable storage. The working copy still lives in this tab.
    }

    let workingFiles;
    let outcomes;

    function applyProposal(proposal) {
      if (!Array.isArray(proposal.edits) || !proposal.edits.length) return "pending";
      const staged = new Map();
      for (const {file, before, after} of proposal.edits) {
        const text = staged.has(file) ? staged.get(file) : workingFiles.get(file);
        if (typeof text !== "string" || typeof before !== "string" || !before ||
            typeof after !== "string" || before === after) return "unmatched";
        const start = text.indexOf(before);
        if (start < 0 || text.indexOf(before, start + 1) !== -1) return "unmatched";
        staged.set(file, text.slice(0, start) + after + text.slice(start + before.length));
      }
      for (const [file, text] of staged) workingFiles.set(file, text);
      return "applied";
    }

    function refreshWorkingCopy() {
      workingFiles = new Map(originalFiles);
      outcomes = new Map();
      for (const key of approvals) outcomes.set(key, applyProposal(proposals.get(key)));
      const applied = Array.from(outcomes.values()).filter(state => state === "applied").length;
      el("approval-status").textContent = labels.progress(approvals.length, proposals.size, applied, approvals.length - applied);
      el("approve-all").disabled = approvals.length === proposals.size;
      el("download-revisions").disabled = approvals.length === 0;
    }

    function updateApprovals(next, focusKey) {
      approvals = next;
      if (storageKey) {
        try { localStorage.setItem(storageKey, JSON.stringify(approvals)); } catch (error) {}
      }
      refreshWorkingCopy();
      if (selected) renderActions(selected.node);
      if (focusKey) el("approve-" + focusKey)?.focus({preventScroll: true});
    }

    function renderActions(node) {
      const actions = proposalsByNode.get(node.id);
      el("actions").replaceChildren(...actions.map(proposal => {
        const item = make("li", "action-item");
        item.append(make("p", "", proposal.label));
        const state = outcomes.get(proposal.key);
        const controls = make("div", "action-controls");
        const button = make("button", "control", state ? labels.undo : labels.approve);
        button.type = "button";
        button.id = "approve-" + proposal.key;
        button.addEventListener("click", () => {
          const next = state ? approvals.filter(key => key !== proposal.key) : [...approvals, proposal.key];
          updateApprovals(next, proposal.key);
        });
        controls.append(button);
        if (state) controls.append(make("span", "action-state " + (state === "applied" ? "adopted" : "attention"), labels[state]));
        item.append(controls);
        if (proposal.edits?.length) {
          const preview = make("details", "action-preview");
          preview.append(make("summary", "", labels.preview));
          for (const {file, before, after} of proposal.edits) {
            preview.append(make("p", "action-state", file),
              make("pre", "", labels.before + "\n" + before),
              make("pre", "", labels.after + "\n" + after));
          }
          item.append(preview);
        } else {
          item.append(make("p", "action-state", proposal.reason || labels.noEdits));
        }
        return item;
      }));
      el("action-block").hidden = actions.length === 0;
    }

    // Store reviewed text and its receipt in a ZIP without runtime dependencies.
    function revisionArchive(entries) {
      const encoder = new TextEncoder();
      const localParts = [];
      const directory = [];
      let offset = 0;
      function header(length, signature) {
        const bytes = new Uint8Array(length);
        const view = new DataView(bytes.buffer);
        view.setUint32(0, signature, true);
        return {bytes, view};
      }
      for (const [path, text] of entries) {
        const name = encoder.encode(path);
        const data = encoder.encode(text);
        let crc = 0xffffffff;
        for (const byte of data) {
          crc ^= byte;
          for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
        }
        crc ^= 0xffffffff;
        const local = header(30, 0x04034b50);
        const central = header(46, 0x02014b50);
        local.view.setUint16(4, 20, true);
        local.view.setUint16(6, 0x800, true);
        local.view.setUint16(12, 33, true);
        local.view.setUint32(14, crc, true);
        local.view.setUint32(18, data.length, true);
        local.view.setUint32(22, data.length, true);
        local.view.setUint16(26, name.length, true);
        central.view.setUint16(4, 20, true);
        central.bytes.set(local.bytes.subarray(4, 30), 6);
        central.view.setUint32(42, offset, true);
        localParts.push(local.bytes, name, data);
        directory.push(central.bytes, name);
        offset += local.bytes.length + name.length + data.length;
      }
      const end = header(22, 0x06054b50);
      end.view.setUint16(8, entries.length, true);
      end.view.setUint16(10, entries.length, true);
      end.view.setUint32(12, directory.reduce((sum, part) => sum + part.length, 0), true);
      end.view.setUint32(16, offset, true);
      return new Blob([...localParts, ...directory, end.bytes], {type: "application/zip"});
    }

    function downloadRevisions() {
      const changed = [...workingFiles].filter(([path, text]) => text !== originalFiles.get(path));
      const record = ["# " + labels.receipt, report.title, "## " + labels.files,
        changed.length ? changed.map(([path]) => "- revised/" + path).join("\n") : labels.emptyFiles];
      for (const [key, state] of outcomes) {
        const proposal = proposals.get(key);
        const reason = state === "pending" ? proposal.reason || labels.noEdits : "";
        record.push("### " + proposal.nodeId + " " + proposal.nodeTitle + " · " + labels[state],
          proposal.label + (reason ? "\n\n" + reason : ""));
      }
      const entries = changed.map(([path, text]) => ["revised/" + path, text]);
      entries.push(["review-receipt.md", record.join("\n\n") + "\n"]);
      const url = URL.createObjectURL(revisionArchive(entries));
      const anchor = make("a");
      anchor.href = url;
      anchor.download = "approved-paper-revisions.zip";
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    el("approval-tools").hidden = proposals.size === 0;
    el("approve-all").textContent = labels.all;
    el("download-revisions").textContent = labels.download;
    el("approve-all").addEventListener("click", () => {
      updateApprovals([...new Set([...approvals, ...proposals.keys()])]);
    });
    el("download-revisions").addEventListener("click", downloadRevisions);
    refreshWorkingCopy();

    function textBlock(id, value, container = id) {
      el(id).textContent = value || "";
      el(container).hidden = !value;
    }

    function select(id, {navigate = false, reveal = false} = {}) {
      const item = items.get(id);
      if (!item) return;
      const {node, button} = item;
      selected?.button.setAttribute("aria-pressed", "false");
      selected = item;
      button.setAttribute("aria-pressed", "true");

      el("review-number").textContent = node.id;
      el("review-title").textContent = node.title;
      el("review").dataset.severity = severity(node);
      el("review-severity").textContent = labels.severity[severity(node)];
      textBlock("review-summary", node.summary);
      textBlock("support", node.support, "support-block");
      textBlock("gap", node.gap, "gap-block");
      renderActions(node);

      const source = node.source;
      textBlock("locator", source?.locator);
      el("source-before").textContent = source?.pre || "";
      el("highlight").textContent = source?.highlight || "";
      el("source-after").textContent = source?.post || "";
      el("excerpt").hidden = !source;
      el("no-source").hidden = Boolean(source);
      el("original").hidden = !pdf;
      if (pdf) {
        pdf.hash = Number.isInteger(source?.page) && source.page > 0 ? "page=" + source.page : "";
        el("original").href = pdf.href;
      }
      pdfPanel?.select(source);
      el("review-body").scrollTop = 0;
      const sourceBody = el("source-body");
      sourceBody.scrollTop = 0;
      const pane = sourceBody.getBoundingClientRect();
      const highlight = el("highlight").getBoundingClientRect();
      if (source && highlight.top >= pane.bottom) {
        sourceBody.scrollTop = highlight.top - pane.top - 24;
      }

      const hash = "#section-" + encodeURIComponent(id);
      if (navigate && location.hash !== hash) history.pushState(null, "", hash);
      if (navigate) el("selection").textContent = node.id + " " + node.title;
      if (reveal && matchMedia("(max-width: 64.99em)").matches) {
        el("review").focus({preventScroll: true});
        el("review").scrollIntoView({block: "start"});
      }
    }

    const order = Array.from(items.keys());
    const fallback = report.initialNode || order[0];
    function selectFromLocation() {
      const linkedId = order.find(id => location.hash === "#section-" + encodeURIComponent(id));
      select(linkedId || (items.has(fallback) ? fallback : order[0]));
    }

    el("argument-map").addEventListener("keydown", event => {
      if (!event.target.matches(".node")) return;
      const delta = {ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1}[event.key];
      if (delta === undefined) return;
      event.preventDefault();
      const current = order.findIndex(id => items.get(id).button === event.target);
      const next = order[Math.max(0, Math.min(order.length - 1, current + delta))];
      select(next, {navigate: true});
      items.get(next).button.focus();
    });

    window.addEventListener("hashchange", selectFromLocation);
    el("workspace").hidden = false;
    selectFromLocation();
  </script>
</body>
</html>
